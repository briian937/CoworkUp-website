  /* ============================================================

     ============================================================ */
  function h(tag, attrs, ...children) {
    let html = `<${tag}`;
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v === false || v == null) continue;
        html += ` ${k}="${String(v).replace(/"/g, '&quot;')}"`;
      }
    }
    html += ">";
    const voidTags = new Set(["img", "input", "br", "hr", "meta", "link"]);
    if (!voidTags.has(tag)) {
      for (const c of children) {
        if (c == null || c === false) continue;
        if (Array.isArray(c)) html += c.join("");
        else html += c;
      }
      html += `</${tag}>`;
    }
    return html;
  }

    if (route === "/spaces/puerta-del-mar") return "puerta";
    if (route === "/meeting-rooms") return "rooms";
    if (route === "/office") return "office";
    if (route === "/virtual-office") return "virtual";
    if (route === "/contact") return "contact";
    if (route === "/terms") return "terms";
    if (route === "/cancel") return "cancel";
    if (route === "/about") return "about";
    if (route === "/privacy") return "privacy";
    return "notfound";
  }

  function renderPage(route) {
    if (route === "/" || route === "") return renderHome();
    if (route === "/spaces/ruzafa") return renderSpaceDetail("ruzafa");
    if (route === "/spaces/puerta-del-mar") return renderSpaceDetail("puerta-del-mar");
    if (route === "/meeting-rooms") return renderMeetingRooms();
    if (route === "/office") return renderOffice();
    if (route === "/virtual-office") return renderVirtualOffice();
    if (route === "/contact") return renderContact();
    if (route === "/terms") return renderTerms();
    if (route === "/cancel") return renderCancel();
    if (route === "/about") return renderAbout();
    if (route === "/privacy") return renderPrivacy();
    return render404();

  /* ============================================================
     INTERACTIONS
     ============================================================ */
  function bindInteractions() {
    // Mobile menu
    const toggle = document.querySelector(".menu-toggle");
    const mobileMenu = document.querySelector(".mobile-menu");
    if (toggle && mobileMenu) {
      toggle.addEventListener("click", () => {
        const isOpen = mobileMenu.classList.toggle("open");
        toggle.textContent = isOpen ? "✕" : "☰";
      });
      mobileMenu.querySelectorAll("a").forEach(a => {
        a.addEventListener("click", () => {
          mobileMenu.classList.remove("open");
          toggle.textContent = "☰";
        });
      });
    }

    // FAQ
    document.querySelectorAll(".faq-q").forEach(btn => {
      btn.addEventListener("click", () => {
        const item = btn.closest(".faq-item");
        item.classList.toggle("open");
        btn.setAttribute("aria-expanded", item.classList.contains("open"));
      });
    });

    // HubSpot submit helper
    async function submitToHubSpot(formGuid, fields) {
      const res = await fetch(
        `https://api.hsforms.com/submissions/v3/integration/submit/${HUBSPOT.portalId}/${formGuid}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            fields,
            context: { pageUri: window.location.href, pageName: document.title },
          }),
        }
      );
      if (!res.ok) {
        const body = await res.text();
        console.error("HubSpot error:", res.status, body);
        throw new Error(`HubSpot ${res.status}`);
      }
      return res;
    }

    // Contact form
    const form = document.getElementById("contact-form");
    if (form) {
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = form.querySelector("button[type=submit]");
        btn.disabled = true;
        btn.innerHTML = "Sending…";
        try {
          await submitToHubSpot(HUBSPOT.contactFormId, [
            { name: "firstname", value: document.getElementById("fname").value },
            { name: "lastname", value: document.getElementById("lname").value },
            { name: "email", value: document.getElementById("email").value },
            { name: "phone", value: document.getElementById("phone").value },
            { name: "en_que_coworking_estas_interesado_", value: document.getElementById("loc").value },
            { name: "servicios", value: document.getElementById("topic").value },
            { name: "mensaje", value: document.getElementById("msg").value },
          ]);
          form.closest(".contact-form-card").innerHTML = `
            ${eyebrow("Book a tour or ask anything")}
            <div style="margin-top:24px;padding:28px;border-radius:var(--r-md);background:var(--c-accent-soft);border:1px solid #F4E48A">
              <h3 style="font-family:var(--font-display);font-weight:600;font-size:28px;letter-spacing:-0.025em;margin:0 0 8px">Got it. Thanks!</h3>
              <p style="margin:0;color:var(--c-ink-soft)">We usually reply within a few hours. Check your inbox (and maybe spam, just in case).</p>
            </div>
          `;
        } catch {
          btn.disabled = false;
          btn.innerHTML = 'Send message <span class="btn-arrow">→</span>';
          alert("Something went wrong. Please try again or email us directly.");
        }
      });
    }

    // Office form
    const officeForm = document.getElementById("office-form");
    if (officeForm) {
      officeForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = officeForm.querySelector("button[type=submit]");
        btn.disabled = true;
        btn.innerHTML = "Sending…";
        try {
          await submitToHubSpot(HUBSPOT.officeFormId, [
            { name: "firstname", value: document.getElementById("of-name").value },
            { name: "email", value: document.getElementById("of-email").value },
            { name: "phone", value: document.getElementById("of-phone").value },
            { name: "company", value: document.getElementById("of-company").value },
            { name: "numberofemployees", value: document.getElementById("of-employees").value },
            { name: "start_date", value: document.getElementById("of-start").value },
          ]);
          officeForm.closest(".contact-form-card").innerHTML = `
            <div style="padding:28px;border-radius:var(--r-md);background:var(--c-accent-soft);border:1px solid #F4E48A">
              <h3 style="font-family:var(--font-display);font-weight:600;font-size:28px;letter-spacing:-0.025em;margin:0 0 8px">Got it. We'll be in touch!</h3>
              <p style="margin:0;color:var(--c-ink-soft)">Expect a proposal in your inbox within 48 hours. We'll reach out by phone if we need any clarification.</p>
            </div>
          `;
        } catch {
          btn.disabled = false;
          btn.innerHTML = 'Get a proposal <span class="btn-arrow">→</span>';
          alert("Something went wrong. Please try again or email us directly.");
        }
      });
    }

    // Carousels
    document.querySelectorAll("[data-carousel]").forEach(initCarousel);

    // Scroll reveals
    initReveal();
  }

  function initCarousel(el) {
    const track = el.querySelector(".carousel-track");
    const slides = track.querySelectorAll(".carousel-slide");
    const counter = el.querySelector(".carousel-counter");
    const dotsWrap = el.querySelector(".carousel-dots");
    const prevBtn = el.querySelector('[data-dir="prev"]');
    const nextBtn = el.querySelector('[data-dir="next"]');
    const n = slides.length;
    let visible = 3;
    let current = 0;

    function getVisible() {
      if (window.innerWidth <= 560) return 1;
      if (window.innerWidth <= 880) return 2;
      return 3;
    }

    function update() {
      visible = getVisible();
      const pages = Math.max(1, n - visible + 1);
      current = Math.min(current, pages - 1);

      const first = slides[0];
      if (!first) return;
      const slideW = first.getBoundingClientRect().width;
      const gap = parseFloat(getComputedStyle(track).columnGap || getComputedStyle(track).gap || "0");
      track.style.transform = `translateX(-${current * (slideW + gap)}px)`;

      counter.textContent = `${String(current + 1).padStart(2, "0")} / ${String(pages).padStart(2, "0")}`;

      dotsWrap.innerHTML = "";
      for (let i = 0; i < pages; i++) {
        const dot = document.createElement("button");
        dot.className = "carousel-dot" + (i === current ? " active" : "");
        dot.setAttribute("aria-label", `Go to page ${i + 1}`);
        dot.addEventListener("click", () => { current = i; update(); });
        dotsWrap.appendChild(dot);
      }
    }

    function go(dir) {
      const pages = Math.max(1, n - getVisible() + 1);
      current = ((current + dir) % pages + pages) % pages;
      update();
    }

    prevBtn.addEventListener("click", () => go(-1));
    nextBtn.addEventListener("click", () => go(1));

    update();
    window.addEventListener("resize", update);

    const autoplay = setInterval(() => go(1), 4500);
    el.addEventListener("mouseenter", () => clearInterval(autoplay));
  }

  function initReveal() {
    const els = document.querySelectorAll(".reveal");
    if (!els.length) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e, i) => {
        if (e.isIntersecting) {
          setTimeout(() => e.target.classList.add("in"), i * 50);
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.05 });
    els.forEach(el => {
      const rect = el.getBoundingClientRect();
      if (rect.top < window.innerHeight && rect.bottom > 0) {
        el.classList.add("in");
      } else {
        io.observe(el);
      }
    });
  }
